    <text x="76" y="296" fill="#292524" font-family="Outfit, ui-rounded, Arial, sans-serif" font-size="66" font-weight="650" letter-spacing="-2" xml:space="preserve">
      <tspan class="typed" opacity="0">w<set attributeName="opacity" to="1" begin="1.20s" fill="freeze"/></tspan><tspan class="typed" opacity="0">o<set attributeName="opacity" to="1" begin="1.25s" fill="freeze"/></tspan><tspan class="typed" opacity="0">r<set attributeName="opacity" to="1" begin="1.30s" fill="freeze"/></tspan><tspan class="typed" opacity="0">k<set attributeName="opacity" to="1" begin="1.35s" fill="freeze"/></tspan><tspan class="typed" opacity="0"> <set attributeName="opacity" to="1" begin="1.40s" fill="freeze"/></tspan><tspan class="typed" opacity="0">f<set attributeName="opacity" to="1" begin="1.45s" fill="freeze"/></tspan><tspan class="typed" opacity="0">e<set attributeName="opacity" to="1" begin="1.50s" fill="freeze"/></tspan><tspan class="typed" opacity="0">e<set attributeName="opacity" to="1" begin="1.55s" fill="freeze"/></tspan><tspan class="typed" opacity="0">l<set attributeName="opacity" to="1" begin="1.60s" fill="freeze"/></tspan><tspan class="typed" opacity="0"> <set attributeName="opacity" to="1" begin="1.65s" fill="freeze"/></tspan><tspan class="typed" opacity="0" fill="#D97873">l<set attributeName="opacity" to="1" begin="1.70s" fill="freeze"/></tspan><tspan class="typed" opacity="0" fill="#D97873">i<set attributeName="opacity" to="1" begin="1.75s" fill="freeze"/></tspan><tspan class="typed" opacity="0" fill="#D97873">g<set attributeName="opacity" to="1" begin="1.80s" fill="freeze"/></tspan><tspan class="typed" opacity="0" fill="#D97873">h<set attributeName="opacity" to="1" begin="1.85s" fill="freeze"/></tspan><tspan class="typed" opacity="0" fill="#D97873">t<set attributeName="opacity" to="1" begin="1.90s" fill="freeze"/></tspan><tspan class="typed" opacity="0" fill="#D97873">e<set attributeName="opacity" to="1" begin="1.95s" fill="freeze"/></tspan><tspan class="typed" opacity="0" fill="#D97873">r<set attributeName="opacity" to="1" begin="2.00s" fill="freeze"/></tspan><tspan class="typed" opacity="0" fill="#D97873">.<set attributeName="opacity" to="1" begin="2.05s" fill="freeze"/></tspan>
    </text>

    <text x="80" y="362" fill="#78716C" font-family="Outfit, ui-rounded, Arial, sans-serif" font-size="18" font-weight="500" letter-spacing=".2">Product-minded builder · AI agents · Human-friendly systems</text>
    <rect width="1200" height="420" filter="url(#grain)" opacity=".26" style="mix-blend-mode:overlay"/>
