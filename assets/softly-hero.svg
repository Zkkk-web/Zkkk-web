<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Making complicated work feel lighter.</title>
  <desc id="desc">The headline appears one character at a time, with fifty milliseconds between characters.</desc>
  <defs>
    <clipPath id="card"><rect width="1200" height="420" rx="48"/></clipPath>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="58"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="4" seed="23" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <style>
      @media (prefers-reduced-motion: reduce) {
        .typed { opacity: 1 !important; }
      }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="420" fill="#FDFCF8"/>
    <ellipse cx="1050" cy="54" rx="240" ry="150" fill="#E6E6FA" opacity=".72" filter="url(#blur)"/>
    <ellipse cx="90" cy="390" rx="250" ry="155" fill="#FFE4E1" opacity=".82" filter="url(#blur)"/>
    <ellipse cx="930" cy="430" rx="260" ry="115" fill="#E8EFE8" opacity=".76" filter="url(#blur)"/>

