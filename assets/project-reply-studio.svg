<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Codex Reply Studio</title><desc id="desc">A human-reviewed workspace for rule-based and AI-assisted email replies.</desc>
  <defs><clipPath id="card"><rect width="720" height="280" rx="32"/></clipPath><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="3" seed="14"/><feColorMatrix type="saturate" values="0"/></filter></defs>
  <g clip-path="url(#card)">
    <rect width="720" height="280" fill="#EFEDF4"/><circle cx="658" cy="36" r="114" fill="#DDD8E8" opacity=".78"/>
    <text x="38" y="48" fill="#96909F" font-family="Outfit, ui-rounded, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">03 · PRODUCT PROTOTYPE</text>
    <text x="38" y="105" fill="#292524" font-family="Outfit, ui-rounded, Arial, sans-serif" font-size="38" font-weight="650" letter-spacing="-1">Codex reply studio</text>
    <text x="38" y="147" fill="#57534E" font-family="Outfit, ui-rounded, Arial, sans-serif" font-size="20">A quiet workspace for configurable, AI-assisted</text>
    <text x="38" y="177" fill="#57534E" font-family="Outfit, ui-rounded, Arial, sans-serif" font-size="20">email drafts—with a human review before send.</text>
    <rect x="38" y="214" width="132" height="38" rx="19" fill="white" fill-opacity=".76"/><text x="60" y="239" fill="#292524" font-family="Outfit, ui-rounded, Arial, sans-serif" font-size="15" font-weight="650">JAVASCRIPT</text>
    <rect x="180" y="214" width="116" height="38" rx="19" fill="white" fill-opacity=".76"/><text x="202" y="239" fill="#292524" font-family="Outfit, ui-rounded, Arial, sans-serif" font-size="15" font-weight="650">PROTOTYPE</text>
    <circle cx="654" cy="220" r="30" fill="#292524"/><text x="643" y="229" fill="white" font-family="Arial, sans-serif" font-size="28">↗</text>
    <rect width="720" height="280" filter="url(#grain)" opacity=".2" style="mix-blend-mode:overlay"/>
  </g>
</svg>
