<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Making complicated work feel lighter.</title>
  <desc id="desc">The headline appears one character at a time, with fifty milliseconds between characters.</desc>
  <defs>
    <clipPath id="card"><rect width="720" height="480" rx="42"/></clipPath>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="54"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="4" seed="23" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <style>
      @media (prefers-reduced-motion: reduce) {
        .typed { opacity: 1 !important; }
      }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="720" height="480" fill="#FDFCF8"/>
    <ellipse cx="640" cy="74" rx="180" ry="145" fill="#E6E6FA" opacity=".76" filter="url(#blur)"/>
    <ellipse cx="56" cy="438" rx="190" ry="150" fill="#FFE4E1" opacity=".84" filter="url(#blur)"/>
    <ellipse cx="600" cy="480" rx="180" ry="100" fill="#E8EFE8" opacity=".8" filter="url(#blur)"/>

    <circle cx="58" cy="54" r="16" fill="#FFB7B2"/><circle cx="58" cy="54" r="5" fill="white"/>
    <text x="88" y="61" fill="#292524" font-family="Outfit, ui-rounded, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.6">BACY.ZHU</text>
    <text x="664" y="60" fill="#78716C" font-family="Outfit, ui-rounded, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="end" letter-spacing="1">PRODUCT × AI</text>

