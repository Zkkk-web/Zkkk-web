<svg xmlns="http://www.w3.org/2000/svg" width="720" height="850" viewBox="0 0 720 850" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Bacy Zhu — calm systems for complicated work</title>
  <desc id="desc">A mobile-first warm pastel profile banner with soft coral and lavender shapes and tactile grain.</desc>
  <defs>
    <clipPath id="card"><rect width="720" height="850" rx="46"/></clipPath>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="58"/></filter>
    <filter id="shadow" x="-30%" y="-60%" width="160%" height="220%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#292524" flood-opacity=".07"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="4" seed="17" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>
  <g clip-path="url(#card)">
    <rect width="720" height="850" fill="#FDFCF8"/>
    <ellipse cx="632" cy="136" rx="190" ry="170" fill="#E6E6FA" opacity=".76" filter="url(#blur)"/>
    <ellipse cx="82" cy="712" rx="210" ry="190" fill="#FFE4E1" opacity=".86" filter="url(#blur)"/>
    <ellipse cx="600" cy="814" rx="220" ry="120" fill="#E8EFE8" opacity=".8" filter="url(#blur)"/>
    <g filter="url(#shadow)"><rect x="34" y="30" width="652" height="74" rx="37" fill="white" fill-opacity=".74" stroke="#E7E5E4"/></g>
    <circle cx="76" cy="67" r="19" fill="#FFB7B2"/><circle cx="76" cy="67" r="5" fill="white"/>
    <text x="110" y="75" fill="#292524" font-family="Outfit, ui-rounded, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1.6">BACY.ZHU</text>
    <rect x="480" y="45" width="184" height="44" rx="22" fill="#292524"/><circle cx="505" cy="67" r="5" fill="#FFB7B2"/>
    <text x="520" y="74" fill="white" font-family="Outfit, ui-rounded, Arial, sans-serif" font-size="14" font-weight="600">OPEN TO ROLES</text>
    <text x="54" y="244" fill="#292524" font-family="Outfit, ui-rounded, Arial, sans-serif" font-size="72" font-weight="650" letter-spacing="-2">I make</text>
    <text x="278" y="244" fill="#D97873" font-family="'Reenie Beanie', 'Bradley Hand', 'Comic Sans MS', cursive" font-size="90">calm</text>
    <text x="54" y="334" fill="#292524" font-family="Outfit, ui-rounded, Arial, sans-serif" font-size="72" font-weight="650" letter-spacing="-2">systems for</text>
    <text x="54" y="424" fill="#292524" font-family="Outfit, ui-rounded, Arial, sans-serif" font-size="72" font-weight="650" letter-spacing="-2">complicated</text>
    <text x="54" y="514" fill="#292524" font-family="Outfit, ui-rounded, Arial, sans-serif" font-size="72" font-weight="650" letter-spacing="-2">work.</text>
    <text x="58" y="582" fill="#78716C" font-family="Outfit, ui-rounded, Arial, sans-serif" font-size="23">Product-minded builder exploring AI agents,</text>
    <text x="58" y="618" fill="#78716C" font-family="Outfit, ui-rounded, Arial, sans-serif" font-size="23">career tools, and human-friendly systems.</text>
    <g filter="url(#shadow)" font-family="Outfit, ui-rounded, Arial, sans-serif" font-size="18" font-weight="600">
      <rect x="52" y="690" width="196" height="60" rx="30" fill="#FFB7B2"/><text x="91" y="728" fill="#292524">Product thinking</text>
      <rect x="264" y="690" width="154" height="60" rx="30" fill="white" stroke="#E7E5E4"/><text x="303" y="728" fill="#292524">AI agents</text>
      <rect x="434" y="690" width="220" height="60" rx="30" fill="#E8EFE8"/><text x="477" y="728" fill="#292524">Gentle systems</text>
    </g>
    <text x="54" y="807" fill="#78716C" font-family="Outfit, ui-rounded, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="2">ZHEJIANG · CHINA</text>
    <rect width="720" height="850" filter="url(#grain)" opacity=".35" style="mix-blend-mode:overlay"/>
  </g>
</svg>
