<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">WeChat Subscription Workflow</title><desc id="desc">A resilient pipeline that watches public-account updates and delivers them to Feishu.</desc>
  <defs><clipPath id="card"><rect width="720" height="280" rx="32"/></clipPath><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="3" seed="19"/><feColorMatrix type="saturate" values="0"/></filter></defs>
  <g clip-path="url(#card)">
    <rect width="720" height="280" fill="#FDFCF8"/><circle cx="658" cy="36" r="114" fill="#FFB7B2" opacity=".42"/><circle cx="594" cy="278" r="86" fill="#E8EFE8" opacity=".9"/>
    <text x="38" y="48" fill="#A8A29E" font-family="Outfit, ui-rounded, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">04 · CONTENT WORKFLOW</text>
    <text x="38" y="105" fill="#292524" font-family="Outfit, ui-rounded, Arial, sans-serif" font-size="38" font-weight="650" letter-spacing="-1">WeChat subscription flow</text>
    <text x="38" y="147" fill="#57534E" font-family="Outfit, ui-rounded, Arial, sans-serif" font-size="20">Watch public-account updates, preserve delivery</text>
    <text x="38" y="177" fill="#57534E" font-family="Outfit, ui-rounded, Arial, sans-serif" font-size="20">state, and bring new articles into Feishu.</text>
    <rect x="38" y="214" width="132" height="38" rx="19" fill="#F2F0EA"/><text x="60" y="239" fill="#292524" font-family="Outfit, ui-rounded, Arial, sans-serif" font-size="15" font-weight="650">JAVASCRIPT</text>
    <rect x="180" y="214" width="112" height="38" rx="19" fill="#F2F0EA"/><text x="204" y="239" fill="#292524" font-family="Outfit, ui-rounded, Arial, sans-serif" font-size="15" font-weight="650">PIPELINE</text>
    <circle cx="654" cy="220" r="30" fill="#292524"/><text x="643" y="229" fill="white" font-family="Arial, sans-serif" font-size="28">↗</text>
    <rect width="720" height="280" filter="url(#grain)" opacity=".2" style="mix-blend-mode:overlay"/>
  </g>
</svg>
