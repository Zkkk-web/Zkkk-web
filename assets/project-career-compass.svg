<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Career Freedom Compass</title><desc id="desc">An agent skill that turns career uncertainty into comparable paths, financial models, and next actions.</desc>
  <defs><clipPath id="card"><rect width="720" height="280" rx="32"/></clipPath><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="3" seed="11"/><feColorMatrix type="saturate" values="0"/></filter></defs>
  <g clip-path="url(#card)">
    <rect width="720" height="280" fill="#E8EFE8"/><circle cx="660" cy="32" r="116" fill="#D2E0D2" opacity=".72"/>
    <text x="38" y="48" fill="#879386" font-family="Outfit, ui-rounded, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">02 · DECISION TOOL</text>
    <text x="38" y="105" fill="#292524" font-family="Outfit, ui-rounded, Arial, sans-serif" font-size="38" font-weight="650" letter-spacing="-1">Career freedom compass</text>
    <text x="38" y="147" fill="#57534E" font-family="Outfit, ui-rounded, Arial, sans-serif" font-size="20">Compare paths, model trade-offs, and turn a big</text>
    <text x="38" y="177" fill="#57534E" font-family="Outfit, ui-rounded, Arial, sans-serif" font-size="20">career question into the next 30–90 days.</text>
    <rect x="38" y="214" width="98" height="38" rx="19" fill="white" fill-opacity=".76"/><text x="61" y="239" fill="#292524" font-family="Outfit, ui-rounded, Arial, sans-serif" font-size="15" font-weight="650">PYTHON</text>
    <rect x="146" y="214" width="136" height="38" rx="19" fill="white" fill-opacity=".76"/><text x="169" y="239" fill="#292524" font-family="Outfit, ui-rounded, Arial, sans-serif" font-size="15" font-weight="650">AGENT SKILL</text>
    <circle cx="654" cy="220" r="30" fill="#292524"/><text x="643" y="229" fill="white" font-family="Arial, sans-serif" font-size="28">↗</text>
    <rect width="720" height="280" filter="url(#grain)" opacity=".2" style="mix-blend-mode:overlay"/>
  </g>
</svg>
